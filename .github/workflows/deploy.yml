name: Deploy to Xserver

on:
  push:
    branches:
      - main # master の場合は master に変更してください

jobs:
  deploy:
    name: Sync Files
    runs-on: ubuntu-latest

    steps:
      # 1. リポジトリのソースコードを取得
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. 秘密鍵を配置してパスフレーズを自動解除し、rsync で Xserver へ転送
      - name: Deploy with rsync
        env:
          SSH_KEY: ${{ secrets.SFTP_KEY }}
          SSH_PASSPHRASE: ${{ secrets.SFTP_PASSPHRASE }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # パスフレーズを自動解除（空に変更）
          ssh-keygen -p -P "$SSH_PASSPHRASE" -N "" -f ~/.ssh/deploy_key

          # Xserver へ差分アップロード（10022番ポート）
          rsync -avz --delete \
            -e "ssh -p ${{ secrets.SFTP_PORT }} -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            --exclude '.git*' \
            --exclude '.github*' \
            --exclude 'node_modules*' \
            ./ ${{ secrets.SFTP_USER }}@${{ secrets.SFTP_HOST }}:/home/${{ secrets.SFTP_USER }}/blockworks.jp/public_html/test-dayo/