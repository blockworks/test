name: Deploy to Xserver

on:
  push:
    branches:
      - main # master の場合は master に変更してください

jobs:
  deploy:
    name: Sync Files
    runs-on: ubuntu-latest

    steps:
      # 1. リポジトリのソースコードを取得
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. パスフレーズ付き秘密鍵を ssh-agent に読み込ませる
      - name: Setup SSH Keys and known_hosts
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SFTP_KEY }}
          ssh-passphrase: ${{ secrets.SFTP_PASSPHRASE }}

      # 3. rsync で Xserver に差分転送（10022番ポート指定）
      - name: Deploy with rsync
        run: |
          rsync -avz --delete \
            -e "ssh -p ${{ secrets.SFTP_PORT }} -o StrictHostKeyChecking=no" \
            --exclude '.git*' \
            --exclude '.github*' \
            --exclude 'node_modules*' \
            ./ ${{ secrets.SFTP_USER }}@${{ secrets.SFTP_HOST }}:/home/${{ secrets.SFTP_USER }}/blockworks.jp/public_html/test-dayo/