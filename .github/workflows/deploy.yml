name: Deploy to Xserver via FTPS

on:
  push:
    branches:
      - main # master の場合は master に変更

jobs:
  web-deploy:
    name: FTPS Deploy
    runs-on: ubuntu-latest
    steps:
      # 1. コードの取得
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # 2. FTPS で Xserver へ差分アップロード
      - name: Sync files via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          security: loose # 自己署名・証明書の不一致エラーを回避
          server-dir: ./blockworks.jp/public_html/test-dayo/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**